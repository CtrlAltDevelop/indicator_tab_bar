name: indicator_tab_bar_example
description: Demonstrates indicator_tab_bar.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# The indicator imports no Material, so it takes `material_ui` here and
# `package:flutter/material.dart` alike.
dependencies:
  flutter:
    sdk: flutter
  indicator_tab_bar:
    path: ../
  material_ui: ">=1.0.0 <2.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
